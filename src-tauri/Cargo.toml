[package]
name = "santostark-ultron"
version = "1.0.0"
description = "SANTOSTARK U.L.T.R.O.N. CORE // Autonomous Iron Man AI Desktop Operating System"
authors = ["SantoStark"]
edition = "2021"

[lib]
name = "santostark_ultron_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
